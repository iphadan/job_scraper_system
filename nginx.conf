events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream targets using container_name or service_name
    upstream frontend_server {
        server scraper-frontend:5173; # or service name 'frontend-react'
    }

    upstream api_server {
        server scraper-api-gateway:8080; # or service name 'api-gateway'
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Route API requests (Preserving /api/ prefix)
        location /api/ {
            proxy_pass http://api_server/api/;   # <--- Notice /api/ at the end!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route Web UI traffic (Vite/React)
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}